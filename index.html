<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Connector - Auto Data Connect</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(17, 24, 39, 0.85);
            --accent: #6366f1;
            --danger: #f43f5e;
            --success: #10b981;
            --power-btn: #22c55e;
            --text-main: #f3f4f6;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin: 5px 0 10px 0; font-size: 1.2rem; color: #818cf8; }

        .display-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9/16;
            max-height: 52vh;
            background: #030712;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        #remote-video { width: 100%; height: 100%; background: #111; }

        .local-pip {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 90px;
            height: 130px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 10;
            display: none;
        }

        .local-pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .placeholder-text {
            position: absolute;
            color: #6b7280;
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
        }

        .controls-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            max-width: 480px;
            width: 100%;
            margin-top: 12px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .ctrl-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        /* পার্টনার ক্যামেরা সুইচ বাটনটির বর্ডার ও সাইজ বড় করার জন্য নির্দিষ্ট স্টাইল */
        .ctrl-btn.partner-switch-btn {
            width: 56px;
            height: 42px;
            border-radius: 22px;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .ctrl-btn:hover { transform: scale(1.08); background: rgba(51, 65, 85, 1); }
        .ctrl-btn.active { background: var(--danger); border-color: var(--danger); }
        .ctrl-btn.disconnect-btn { background: var(--danger); width: 48px; height: 48px; border-radius: 50%; }
        
        .power-on-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            gap: 20px;
        }
        .power-btn {
            background: var(--power-btn);
            border: none;
            color: white;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
        }

        .chat-container {
            max-width: 480px;
            width: 100%;
            margin-top: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-messages {
            height: 60px;
            overflow-y: auto;
            background: #030712;
            border-radius: 8px;
            padding: 6px;
            font-size: 0.85rem;
        }

        .chat-input-area { display: flex; gap: 6px; }
        .chat-input-area input {
            flex: 1; background: #030712; border: 1px solid var(--border); border-radius: 6px;
            padding: 6px 10px; color: white; font-size: 0.85rem; outline: none;
        }
        .chat-input-area button {
            background: var(--accent); color: white; border: none; border-radius: 6px;
            padding: 0 12px; cursor: pointer; font-weight: bold;
        }

        .status-badge { font-size: 0.8rem; color: #34d399; margin-bottom: 6px; font-weight: 600; }
    </style>
</head>
<body>

    <h2>Main Connector</h2>
    <div class="status-badge" id="status-text">Status: Connecting to Server...[cite: 3]</div>

    <div id="active-call-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="display-container">
            <div class="placeholder-text" id="screen-placeholder">Camera is Off / Waiting for Partner[cite: 3]</div>
            <video id="remote-video" autoplay playsinline></video>
            <div class="local-pip" id="local-pip-box">
                <video id="local-video" autoplay muted playsinline></video>
            </div>
        </div>

        <div class="controls-bar" id="controls-bar">
            <button class="ctrl-btn" id="cam-toggle-btn" onclick="toggleCamera()" title="Camera On/Off">📷</button>
            <button class="ctrl-btn" onclick="switchCamera()" title="Switch Own Camera">🔄</button>
            <button class="ctrl-btn partner-switch-btn" onclick="switchPartnerCamera()" title="Switch Partner Camera">🔄👥</button>
            <button class="ctrl-btn" id="rec-btn" onclick="toggleRecord()" title="Record Video">⏺️</button>
            <button class="ctrl-btn" onclick="capturePhoto()" title="Capture Photo">📸</button>
            <button class="ctrl-btn" id="mic-toggle-btn" onclick="toggleMic()" title="Mute/Unmute Voice">🎤</button>
            <button class="ctrl-btn disconnect-btn" onclick="disconnectCall()" title="Disconnect & Shutdown">❌</button>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chat-box">
                <div style="color: #6b7280;">Live text chat available here...[cite: 3]</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Type a text message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <div class="power-on-screen" id="power-screen">
        <h3 style="color: #f43f5e; margin: 0;">System Shutdown</h3>
        <p style="color: #9ca3af; font-size: 0.9rem; margin: 0;">Call is completely disconnected.</p>
        <button class="power-btn" onclick="powerOnSystem()" title="Power On">🔛</button>
    </div>

<script>
    const FIXED_MAIN_ID = "suraj_main_room_999";
    const FIXED_SAMPLE_ID = "suraj_sample_room_999";

    let peer = new Peer(FIXED_MAIN_ID);
    let localStream = null;
    let currentCall = null;
    let dataConnection = null;
    let isCameraActive = false;
    let isMicMuted = false;
    let usingFrontCamera = true;
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];

    peer.on('open', () => {
        document.getElementById('status-text').innerText = "Status: Ready & Waiting for Sample...[cite: 3]";
        setTimeout(autoConnect, 2000);
    });

    function autoConnect() {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            localStream.getVideoTracks().forEach(t => t.enabled = false);
            connectToSampleAndData(localStream);
        }).catch(err => console.log("Media init error:", err));
    }

    function connectToSampleAndData(stream) {
        const call = peer.call(FIXED_SAMPLE_ID, stream);
        setupCallEvents(call);

        if (!dataConnection || !dataConnection.open) {
            dataConnection = peer.connect(FIXED_SAMPLE_ID);
            setupDataEvents(dataConnection);
        }
    }

    function setupDataEvents(conn) {
        dataConnection = conn;
        conn.on('open', () => {
            console.log("Data connection established automatically.");
        });
        conn.on('data', (data) => {
            appendChatMessage("Partner", data);
        });
    }

    peer.on('connection', (conn) => {
        setupDataEvents(conn);
    });

    function switchPartnerCamera() {
        if (dataConnection && dataConnection.open) {
            dataConnection.send("CMD_SWITCH_CAMERA");
        } else {
            dataConnection = peer.connect(FIXED_SAMPLE_ID);
            dataConnection.on('open', () => {
                dataConnection.send("CMD_SWITCH_CAMERA");
            });
        }
    }

    peer.on('call', (call) => {
        if (!dataConnection || !dataConnection.open) {
            dataConnection = peer.connect(FIXED_SAMPLE_ID);
            setupDataEvents(dataConnection);
        }

        if (!localStream) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                localStream.getVideoTracks().forEach(t => t.enabled = false);
                call.answer(localStream);
                setupCallEvents(call);
            });
        } else {
            call.answer(localStream);
            setupCallEvents(call);
        }
    });

    function setupCallEvents(call) {
        currentCall = call;
        call.on('stream', (remoteStream) => {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = remoteStream;
            document.getElementById('screen-placeholder').style.display = 'none';
            document.getElementById('status-text').innerText = "Status: Connected Successfully![cite: 3]";
        });

        call.on('close', () => { triggerShutdown(); });
    }

    async function toggleCamera() {
        const camBtn = document.getElementById('cam-toggle-btn');
        const pipBox = document.getElementById('local-pip-box');
        const localVideo = document.getElementById('local-video');
        const placeholder = document.getElementById('screen-placeholder');

        if (!isCameraActive) {
            if (localStream && localStream.getVideoTracks().length > 0) {
                localStream.getVideoTracks()[0].enabled = true;
                localVideo.srcObject = localStream;
                pipBox.style.display = 'block';
                isCameraActive = true;
                camBtn.classList.add('active');
                placeholder.style.display = 'none';
            }
        } else {
            if (localStream && localStream.getVideoTracks().length > 0) {
                localStream.getVideoTracks()[0].enabled = false;
            }
            localVideo.srcObject = null;
            pipBox.style.display = 'none';
            isCameraActive = false;
            camBtn.classList.remove('active');
            if (!document.getElementById('remote-video').srcObject) {
                placeholder.style.display = 'block';
            }
        }
    }

    function toggleMic() {
        const micBtn = document.getElementById('mic-toggle-btn');
        if (!localStream) return;

        isMicMuted = !isMicMuted;
        localStream.getAudioTracks().forEach(track => { track.enabled = !isMicMuted; });

        if (isMicMuted) {
            micBtn.classList.add('active');
            micBtn.innerText = "🔇";
        } else {
            micBtn.classList.remove('active');
            micBtn.innerText = "🎤";
        }
    }

    async function switchCamera() {
        usingFrontCamera = !usingFrontCamera;
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, 
                audio: true 
            });
            const oldAudioTrack = localStream.getAudioTracks()[0];
            if (oldAudioTrack) { newStream.getAudioTracks()[0].enabled = oldAudioTrack.enabled; }
            localStream.getVideoTracks().forEach(t => t.stop());
            localStream = newStream;
            if (isCameraActive) { document.getElementById('local-video').srcObject = localStream; }
            updateStreamInCall();
        } catch (err) { alert("Could not switch camera.[cite: 3]"); }
    }

    function updateStreamInCall() {
        if (!currentCall || !currentCall.peerConnection) return;
        const videoTrack = localStream.getVideoTracks()[0];
        const senders = currentCall.peerConnection.getSenders();
        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
        if (videoSender) { videoSender.replaceTrack(videoTrack); }
    }

    function toggleRecord() {
        const recBtn = document.getElementById('rec-btn');
        const remoteVideo = document.getElementById('remote-video');
        if (!isRecording) {
            if (!remoteVideo.srcObject) return alert("No active video stream to record![cite: 3]");
            recordedChunks = [];
            try {
                mediaRecorder = new MediaRecorder(remoteVideo.srcObject, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = 'call-recording.webm'; a.click();
                };
                mediaRecorder.start();
                isRecording = true;
                recBtn.style.background = 'var(--success)';
                recBtn.innerText = "⏹️";
            } catch (err) { alert("Recording not supported on this browser.[cite: 3]"); }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            recBtn.style.background = '';
            recBtn.innerText = "⏺️";
        }
    }

    function capturePhoto() {
        const remoteVideo = document.getElementById('remote-video');
        if (!remoteVideo.srcObject) return alert("No video stream available to capture![cite: 3]");
        const canvas = document.createElement('canvas');
        canvas.width = remoteVideo.videoWidth || 640;
        canvas.height = remoteVideo.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(remoteVideo, 0, 0, canvas.width, canvas.height);
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a'); a.href = url; a.download = 'snapshot.png'; a.click();
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;
        if (dataConnection && dataConnection.open) {
            dataConnection.send(text);
            appendChatMessage("You", text);
            input.value = '';
        } else { alert("Partner not connected for text messaging yet.[cite: 3]"); }
    }

    function handleKeyPress(e) { if (e.key === 'Enter') { sendMessage(); } }

    function appendChatMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        if (chatBox.children.length === 1 && chatBox.children[0].style.color) { chatBox.innerHTML = ''; }
        const msgDiv = document.createElement('div');
        msgDiv.innerHTML = `<b>${sender}:</b> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function disconnectCall() {
        if (currentCall) { currentCall.close(); }
        if (dataConnection) { dataConnection.close(); }
        if (localStream) { localStream.getTracks().forEach(track => track.stop()); }
        triggerShutdown();
    }

    function triggerShutdown() {
        document.getElementById('active-call-container').style.display = 'none';
        document.getElementById('power-screen').style.display = 'flex';
        document.getElementById('status-text').innerText = "Status: System Shutdown";
    }

    function powerOnSystem() { window.location.reload(); }
</script>
</body>
</html>
