<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Call</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(17, 24, 39, 0.85);
            --accent: #6366f1;
            --danger: #f43f5e;
            --success: #10b981;
            --power-btn: #22c55e;
            --text-main: #f3f4f6;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }
        h2 { margin: 5px 0 10px 0; font-size: 1.2rem; color: #818cf8; }
        .display-container {
            position: relative; width: 100%; max-width: 480px; aspect-ratio: 9/16; max-height: 52vh;
            background: #030712; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #remote-video { width: 100%; height: 100%; background: #111; }
        .local-pip {
            position: absolute; top: 15px; right: 15px; width: 90px; height: 130px;
            background: #000; border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); z-index: 10; display: none;
        }
        .local-pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .placeholder-text { position: absolute; color: #6b7280; font-size: 0.9rem; text-align: center; pointer-events: none; }
        .controls-bar {
            display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;
            max-width: 480px; width: 100%; margin-top: 12px; background: var(--card-bg); padding: 10px; border-radius: 16px; border: 1px solid var(--border);
        }
        .ctrl-btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border); color: white;
            width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: all 0.2s;
        }
        .ctrl-btn.partner-switch-btn { width: 56px; height: 42px; border-radius: 22px; font-size: 16px; letter-spacing: 2px; }
        .ctrl-btn:hover { transform: scale(1.08); background: rgba(51, 65, 85, 1); }
        .ctrl-btn.active { background: var(--danger); border-color: var(--danger); }
        .ctrl-btn.disconnect-btn { background: var(--danger); width: 48px; height: 48px; border-radius: 50%; }
        .chat-container {
            max-width: 480px; width: 100%; margin-top: 10px; background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;
        }
        .chat-messages { height: 60px; overflow-y: auto; background: #030712; border-radius: 8px; padding: 6px; font-size: 0.85rem; }
        .chat-input-area { display: flex; gap: 6px; }
        .chat-input-area input {
            flex: 1; background: #030712; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: white; font-size: 0.85rem; outline: none;
        }
        .chat-input-area button { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 0 12px; cursor: pointer; font-weight: bold; }
        .status-badge { font-size: 0.8rem; color: #34d399; margin-bottom: 6px; font-weight: 600; }
    
        .location-panel {
            max-width: 480px; width: 100%; margin-top: 10px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 10px; box-sizing: border-box;
        }
        .location-head {
            display:flex; justify-content:space-between; align-items:center;
            gap:8px; font-size:.85rem; font-weight:700; margin-bottom:8px;
        }
        .location-status { color:#34d399; font-size:.75rem; font-weight:600; }
        .map-toolbar {
            display:flex; gap:6px; overflow-x:auto; padding-bottom:7px;
            scrollbar-width:none;
        }
        .map-toolbar::-webkit-scrollbar { display:none; }
        .map-btn {
            flex:0 0 auto; border:1px solid var(--border); background:#111827;
            color:#fff; border-radius:8px; padding:7px 9px; font-size:.72rem;
            cursor:pointer; white-space:nowrap;
        }
        .map-btn.active { background:var(--accent); }
        #location-map {
            width:100%; height:250px; border-radius:10px; overflow:hidden;
            background:#111827; position:relative;
        }
        #location-map iframe {
            width:100%; height:100%; border:0; display:block;
        }
        .location-info {
            display:none; margin-top:7px; color:#d1d5db; font-size:.72rem;
            line-height:1.45; word-break:break-word;
        }
        .location-actions { display:flex; gap:7px; margin-top:8px; }
        .location-actions button {
            flex:1; padding:8px 10px; border:1px solid var(--border);
            border-radius:8px; background:rgba(30,41,59,.8); color:white;
            cursor:pointer; font-weight:600;
        }
        @media (max-width: 600px) {
            body { padding:7px; }
            h2 { font-size:1rem; }
            .display-container {
                max-width:100%; aspect-ratio: 9/14; max-height:none;
                border-radius:12px;
            }
            .controls-bar { margin-top:7px; padding:7px; gap:6px; }
            .ctrl-btn { width:40px; height:40px; }
            .ctrl-btn.partner-switch-btn { width:52px; }
            .chat-container { margin-top:7px; padding:8px; }
            .chat-messages { height:54px; }
            .location-panel { margin-top:7px; padding:8px; }
            #location-map { height:245px; }
        }
    </style>
</head>
<body>

    <h2>Main Connector</h2>
    <div class="status-badge" id="status-text">Status: Connecting to Server...</div>

    <div id="active-call-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="display-container">
            <div class="placeholder-text" id="screen-placeholder">Camera is Off / Waiting for Partner</div>
            <video id="remote-video" autoplay playsinline></video>
            <div class="local-pip" id="local-pip-box">
                <video id="local-video" autoplay muted playsinline></video>
            </div>
        </div>

        <div class="controls-bar">
            <button class="ctrl-btn" id="cam-toggle-btn" onclick="toggleCamera()" title="Camera On/Off">📷</button>
            <button class="ctrl-btn" onclick="switchCamera()" title="Switch Own Camera">🔄</button>
            <button class="ctrl-btn partner-switch-btn" onclick="switchPartnerCamera()" title="Switch Partner Camera">🔄👥</button>
            <button class="ctrl-btn" id="rec-btn" onclick="toggleRecord()" title="Record Video">⏺️</button>
            <button class="ctrl-btn" onclick="capturePhoto()" title="Capture Photo">📸</button>
            <button class="ctrl-btn" id="mic-toggle-btn" onclick="toggleMic()" title="Mute/Unmute Voice">🎤</button>
            <button class="ctrl-btn disconnect-btn" onclick="disconnectCall()" title="Disconnect & Shutdown">❌</button>
        </div>

        <div class="location-panel">
            <div class="location-head">
                <span>📍 Partner Live Location</span>
                <span class="location-status" id="location-status">Waiting...</span>
            </div>

            <div class="map-toolbar">
                <button class="map-btn active" data-map="street" onclick="setMapMode('street')">🗺️ Street</button>
                <button class="map-btn" data-map="satellite" onclick="setMapMode('satellite')">🛰️ Satellite</button>
                <button class="map-btn" data-map="terrain" onclick="setMapMode('terrain')">⛰️ Terrain</button>
                <button class="map-btn" data-map="hybrid" onclick="setMapMode('hybrid')">🌍 Hybrid</button>
                <button class="map-btn" data-map="cycle" onclick="setMapMode('cycle')">🚲 Cycle</button>
            </div>

            <div id="location-map"></div>
            <div class="location-info" id="location-info"></div>

            <div class="location-actions">
                <button onclick="requestPartnerLocation()">📍 Request / Refresh</button>
                <button onclick="openPartnerLocation()" id="open-map-btn" style="display:none;">🧭 Open Google Maps</button>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chat-box">
                <div style="color: #6b7280;">Live text chat available here...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Type a text message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

<script>
    const MAIN_ID = "suraj_main_room_999";
    const SAMPLE_ID = "suraj_sample_room_999";

    let peer = new Peer(MAIN_ID);
    let localStream = null;
    let currentCall = null;
    let dataConnection = null;
    let isCameraActive = false;
    let isMicMuted = false;
    let usingFrontCamera = true;
    let currentResolutionLevel = 'high';
    let partnerLocation = null;
    let locationMap = null;
    let locationMarker = null;
    let currentMapMode = 'street';

    peer.on('open', () => {
        document.getElementById('status-text').innerText = "Status: Ready, Waiting for Sample Partner...";
        initMedia();
    });

    function initMedia() {
        navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
            audio: true 
        }).then(stream => {
            localStream = stream;
            localStream.getVideoTracks().forEach(t => t.enabled = false);
            startNetworkQualityMonitor();
        }).catch(err => {
            document.getElementById('status-text').innerText = "Status: Camera/Mic permission needed!";
        });
    }

    // যখন Sample Partner কল করবে, মেইন কানেক্টর তা রিসিভ করবে
    peer.on('call', (call) => {
        if (!localStream) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                call.answer(localStream);
                setupCallEvents(call);
            });
        } else {
            call.answer(localStream);
            setupCallEvents(call);
        }
    });

    peer.on('connection', (conn) => {
        setupDataEvents(conn);
    });

    function setupCallEvents(call) {
        currentCall = call;
        call.on('stream', (remoteStream) => {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = remoteStream;
            remoteVideo.play().catch(() => {});
            remoteStream.getVideoTracks().forEach(track => {
                track.addEventListener('ended', () => {
                    if (remoteVideo.srcObject === remoteStream) {
                        remoteVideo.pause();
                        remoteVideo.srcObject = null;
                        document.getElementById('screen-placeholder').style.display = 'block';
                    }
                });
            });
            document.getElementById('screen-placeholder').style.display = 'none';
            document.getElementById('status-text').innerText = "Status: Connected Successfully!";
        });
        call.on('close', () => { triggerShutdown(); });
    }

    function setupDataEvents(conn) {
        dataConnection = conn;
        conn.on('data', (data) => {
            if (data === "CMD_SWITCH_CAMERA") {
                switchCamera();
            } else if (data === "CMD_REQUEST_LOCATION") {
                // Partner is asked to start sharing GPS.
                appendChatMessage("System", "Location request sent to Partner.");
            } else if (typeof data === "object" && data && data.type === "location") {
                updatePartnerLocation(data);
            } else if (typeof data === "object" && data && data.type === "location-status") {
                setLocationStatus(data.message || "Location status updated.", data.active);
            } else {
                appendChatMessage("Partner", data);
            }
        });
    }

    function switchPartnerCamera() {
        if (dataConnection && dataConnection.open) {
            dataConnection.send("CMD_SWITCH_CAMERA");
        }
    }

    function requestPartnerLocation() {
        if (!dataConnection || !dataConnection.open) {
            setLocationStatus("Call/data connection not ready.", false);
            return;
        }
        dataConnection.send("CMD_REQUEST_LOCATION");
        setLocationStatus("Request sent — waiting for GPS...", false);
    }

    function setLocationStatus(text, active) {
        const el = document.getElementById('location-status');
        el.innerText = text;
        el.style.color = active ? '#34d399' : '#fbbf24';
    }

    function updatePartnerLocation(data) {
        partnerLocation = data;

        const mapEl = document.getElementById('location-map');
        const infoEl = document.getElementById('location-info');
        const openBtn = document.getElementById('open-map-btn');

        mapEl.style.display = 'block';
        infoEl.style.display = 'block';
        openBtn.style.display = 'block';

        const accuracy = data.accuracy ? Math.round(data.accuracy) + ' m' : 'unknown';
        const updated = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : 'now';
        const latText = Number(data.lat).toFixed(6);
        const lngText = Number(data.lng).toFixed(6);
        const speedText = (data.speed != null && data.speed >= 0)
            ? (Number(data.speed) * 3.6).toFixed(1) + ' km/h'
            : '—';
        const headingText = (data.heading != null && data.heading >= 0)
            ? Math.round(Number(data.heading)) + '°'
            : '—';

        infoEl.innerHTML =
            '<b>📍 Partner Location</b><br>' +
            'Latitude: ' + latText + '<br>' +
            'Longitude: ' + lngText + '<br>' +
            'Accuracy: ' + accuracy + ' • Speed: ' + speedText +
            ' • Direction: ' + headingText +
            '<br>Updated: ' + updated;

        setLocationStatus("LIVE", true);
        renderPartnerMap(data.lat, data.lng, data.accuracy);
    }

    function setMapMode(mode) {
        currentMapMode = mode;

        document.querySelectorAll('.map-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.map === mode);
        });

        if (partnerLocation) {
            renderPartnerMap(
                partnerLocation.lat,
                partnerLocation.lng,
                partnerLocation.accuracy
            );
        }
    }

    function renderPartnerMap(lat, lng, accuracy) {
        const mapEl = document.getElementById('location-map');
        const latN = Number(lat);
        const lngN = Number(lng);

        // Map mode -> public OpenStreetMap-based layer.
        // No API key is required for the preview.
        let layer = 'mapnik';
        let name = 'Street Map';

        if (currentMapMode === 'terrain') {
            layer = 'opentopomap';
            name = 'Terrain';
        } else if (currentMapMode === 'cycle') {
            layer = 'cyclemap';
            name = 'Cycle Map';
        } else if (currentMapMode === 'satellite' || currentMapMode === 'hybrid') {
            // OpenStreetMap export does not provide a satellite layer.
            // Use a Google Maps satellite/hybrid preview for these modes.
            const type = currentMapMode === 'satellite' ? 'k' : 'h';
            const googleUrl =
                'https://www.google.com/maps?q=' +
                encodeURIComponent(latN + ',' + lngN) +
                '&t=' + type;

            mapEl.innerHTML =
                '<iframe title="' + name + ' partner location" ' +
                'src="' + googleUrl + '" loading="lazy" ' +
                'referrerpolicy="no-referrer-when-downgrade"></iframe>';
            return;
        }

        const delta = 0.006;
        const bbox = [
            lngN - delta,
            latN - delta,
            lngN + delta,
            latN + delta
        ].join('%2C');

        const marker = encodeURIComponent(latN + ',' + lngN);

        mapEl.innerHTML =
            '<iframe title="' + name + ' partner location" loading="lazy" ' +
            'src="https://www.openstreetmap.org/export/embed.html?bbox=' +
            bbox + '&layer=' + encodeURIComponent(layer) +
            '&marker=' + marker + '"></iframe>';
    }

    function openPartnerLocation() {
        if (!partnerLocation) return;
        const url = 'https://www.google.com/maps?q=' +
            encodeURIComponent(partnerLocation.lat + ',' + partnerLocation.lng);
        window.open(url, '_blank', 'noopener');
    }

    function startNetworkQualityMonitor() {
        setInterval(async () => {
            if (!currentCall || !currentCall.peerConnection) return;
            try {
                const stats = await currentCall.peerConnection.getStats();
                let currentRTT = null;
                stats.forEach(report => {
                    if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                        currentRTT = report.currentRoundTripTime;
                    }
                });
                if (currentRTT !== null) {
                    if (currentRTT > 0.35 && currentResolutionLevel !== 'low') {
                        setCameraResolution('low');
                    } else if (currentRTT > 0.2 && currentRTT <= 0.35 && currentResolutionLevel !== 'medium') {
                        setCameraResolution('medium');
                    } else if (currentRTT <= 0.2 && currentResolutionLevel !== 'high') {
                        setCameraResolution('high');
                    }
                }
            } catch (e) {}
        }, 4000);
    }

    async function setCameraResolution(level) {
        if (!localStream) return;
        let constraints = level === 'low' ? { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { max: 15 } } :
                          level === 'medium' ? { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { max: 24 } } :
                          { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { max: 30 } };
        currentResolutionLevel = level;
        try {
            await localStream.getVideoTracks()[0].applyConstraints(constraints);
        } catch (e) {}
    }

    async function toggleCamera() {
        const camBtn = document.getElementById('cam-toggle-btn');
        const pipBox = document.getElementById('local-pip-box');
        const localVideo = document.getElementById('local-video');
        if (!isCameraActive) {
            if (localStream) {
                localStream.getVideoTracks()[0].enabled = true;
                localVideo.srcObject = localStream;
                pipBox.style.display = 'block';
                isCameraActive = true;
                camBtn.classList.add('active');
                updateStreamInCall();
            }
        } else {
            if (localStream) {
                const oldTrack = localStream.getVideoTracks()[0];
                if (oldTrack) oldTrack.enabled = false;
            }
            localVideo.pause();
            localVideo.srcObject = null;
            pipBox.style.display = 'none';
            isCameraActive = false;
            replaceOutgoingVideoWithBlackTrack();
            camBtn.classList.remove('active');
        }
    }

    function toggleMic() {
        if (!localStream) return;
        isMicMuted = !isMicMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
        const micBtn = document.getElementById('mic-toggle-btn');
        micBtn.classList.toggle('active', isMicMuted);
        micBtn.innerText = isMicMuted ? "🔇" : "🎤";
    }

    async function switchCamera() {
        usingFrontCamera = !usingFrontCamera;
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, audio: true 
            });
            localStream.getVideoTracks().forEach(t => t.stop());
            localStream = newStream;
            if (isCameraActive) document.getElementById('local-video').srcObject = localStream;
            updateStreamInCall();
        } catch (e) {}
    }

    let blackVideoTrack = null;

    function getBlackVideoTrack() {
        if (blackVideoTrack && blackVideoTrack.readyState === 'live') return blackVideoTrack;
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 360;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        blackVideoTrack = canvas.captureStream(5).getVideoTracks()[0];
        return blackVideoTrack;
    }

    async function replaceOutgoingVideoWithBlackTrack() {
        if (!currentCall || !currentCall.peerConnection) return;
        const sender = currentCall.peerConnection.getSenders()
            .find(s => s.track && s.track.kind === 'video');
        if (sender) {
            try { await sender.replaceTrack(getBlackVideoTrack()); } catch (e) {}
        }
    }

    async function updateStreamInCall() {
        if (!currentCall || !currentCall.peerConnection || !localStream) return;
        const videoTrack = isCameraActive
            ? localStream.getVideoTracks()[0]
            : getBlackVideoTrack();
        const sender = currentCall.peerConnection.getSenders()
            .find(s => s.track && s.track.kind === 'video');
        if (sender && videoTrack) {
            try { await sender.replaceTrack(videoTrack); } catch (e) {}
        }
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !dataConnection || !dataConnection.open) return;
        dataConnection.send(text);
        appendChatMessage("You", text);
        input.value = '';
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    function appendChatMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div><b>${sender}:</b> ${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    function disconnectCall() {
        if (blackVideoTrack) blackVideoTrack.stop();
        window.location.reload();
    }

    window.addEventListener('beforeunload', () => {
        if (blackVideoTrack) blackVideoTrack.stop();
    });
    function triggerShutdown() { document.getElementById('status-text').innerText = "Status: Disconnected"; }
</script>
</body>
</html>
